              - Esparagus Audio Brick: ru/boards/esparagus-audio-brick.md
              - Esparagus Audio Brick Dual: ru/boards/esparagus-audio-brick-dual-dac.md
              - HiFi-ESP32: ru/boards/hifi-esp32.md
              - Loud-ESP32 и Esparagus Echo: ru/boards/loud-esp32.md
              - Amped-ESP32: ru/boards/amped-esp32.md
              - Louder-ESP32: ru/boards/louder-esp32.md
              - Seeed XIAO ESP32-C5: ru/boards/xiao-esp32c5.md
              - Пользовательская плата: ru/boards/custom.md
      - Возможности:
          - Bluetooth A2DP: ru/features/bluetooth.md
          - USB-аудио (UAC): ru/features/usb-audio.md
          - Sendspin (экспериментально): ru/features/sendspin.md
          - Ethernet (W5500): ru/features/ethernet.md
          - OLED-дисплей: ru/features/oled-display.md
          - TFT-дисплей ST7789: ru/features/tft-display.md
          - Аппаратные кнопки: ru/features/buttons.md
