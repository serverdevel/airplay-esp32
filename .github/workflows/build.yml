name: Build

# Reusable firmware build for the only supported release target. Other board
# profiles remain in the source tree as unverified upstream references, but must
# not be published by this fork.
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: esp32s3
            target: esp32s3
            sdkconfig: "config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          command: >
            idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.sdkconfig }}" build &&
            cd build &&
            esptool.py --chip ${{ matrix.target }} merge_bin --format raw -o merged-firmware.bin $(cat flash_args) &&
            cp merged-firmware.bin ../airplay2-receiver-${{ matrix.name }}.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.name }}
          path: airplay2-receiver-${{ matrix.name }}.bin
